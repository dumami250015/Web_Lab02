<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <title>Survey Form</title>
    <style>
        body {
            padding: 20px;
        }

        .survey-container img {
            width: 150px; 
            margin-bottom: 15px;
        }

        .survey-container h2 {
            color: #1e9690;
            padding-bottom: 10px;
        }

        .survey-container h3 {
            color: #1e9690; 
            margin-top: 25px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="survey-container">
        
        <img src="logo-hcmiu.png" alt="Ho Chi Minh City International University Logo">

        <h2>Survey</h2>
        <p>If you have a moment, we'd appreciate it if you would fill out this survey.</p>

        <form action="" method="post">
            <h3>Your information:</h3>
            <div class="row">
                <div class="col">
                    <label for="fname">First Name:</label>
                </div>
                <div class="col">
                    <input type="text" class="form-control" id="fname" name="first_name">
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label for="lname">Last Name:</label>
                </div>
                <div class="col">
                    <input type="text" class="form-control" id="lname" name="last_name">
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label for="email">Email:</label>
                </div>
                <div class="col">
                    <input type="email" class="form-control" id="email" name="email">
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label for="dob">Date of Birth:</label>
                </div>
                <div class="col">
                    <input type="date" class="form-control" id="dob" name="dob">
                </div>
            </div>

            <div>
                <h3>How did you hear about us?</h3>
                <div class="form-check-inline">
                    <input type="radio" class="form-check-input" id="search" name="hear_about" value="search_engine">
                    <label class="form-check-label" for="search">Search engine</label>
                </div>

                <div class="form-check-inline">
                    <input type="radio" class="form-check-input" id="word" name="hear_about" value="word_of_mouth">
                    <label class="form-check-label" for="word">Word of mouth</label>
                </div>

                <div class="form-check-inline">
                    <input type="radio" class="form-check-input" id="social" name="hear_about" value="social_media">
                    <label class="form-check-label" for="social">Social Media</label>
                </div>

                <div class="form-check-inline">
                    <input type="radio" class="form-check-input" id="other" name="hear_about" value="other">
                    <label class="form-check-label" for="other">Other</label>
                </div>
            </div>

            <div>
                <h3>Would you like to receive announcements about new CDs and special offers?</h3>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="like" name="like_offers" value="yes">
                    <label for="like" class="form-check-label">YES, I'd like that.</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="send_email" name="send_email_announcements" value="yes" checked>
                    <label for="send_email" class="form-check-label">YES, please send me email announcements.</label>
                </div>
            </div>

            <div>
                <label for="contact_method">Please contact me by:</label>
                <select id="contact_method" name="contact_method">
                    <option value="email_or_postal">Email or postal mail</option>
                    <option value="email_only">Email only</option>
                    <option value="postal_only">Postal mail only</option>
                </select>
            </div>

            <div>
                <input type="submit" value="Submit">
            </div>

        </form>
    </div>

</body>
</html>
